name: Compilar servicio de impresora (Windows)

on:
  push:
    branches: [impresora]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: impresora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar .exe independiente (no requiere Python en el destino)
        run: pyinstaller --onefile --noconsole --name ServicioImpresoraFacturaK --collect-all bleak --collect-submodules winrt servicio_impresora.py

      - name: Crear instalador
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador.iss

      - uses: actions/upload-artifact@v4
        with:
          name: FacturaK-Impresora
          path: |
            impresora/dist/ServicioImpresoraFacturaK.exe
            impresora/instalador/Instalar_FacturaK_Impresora.exe
